[package]
name = "nordiee-launcher"
version = "0.1.0"
description = "Nordiee desktop game launcher"
authors = ["Nordiee"]
edition = "2021"

[lib]
name = "nordiee_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
nordiee-core = { path = "../crates/nordiee-core" }
